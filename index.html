<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Holo FindAR</title>
<link rel="icon" href="Holo_findAR_icon.png" type="image/png">
<link rel="apple-touch-icon" href="Holo_findAR_icon.png">
<link rel="manifest" href="holo_manifest.json">
<meta name="theme-color" content="#1d331d">

<style>
  /* 配色はアイコン(Holo_findAR_icon.png)から取得 */
  :root {
    --bg0: #1d331d;   /* 背景(上) */
    --bg1: #2e5e38;   /* 背景(中) */
    --bg2: #469451;   /* 背景(下)・縁取り */
    --ink: #ffffff;   /* 文字 */
    --sub: #cdcdcd;   /* 補足の文字 */
  }
  html, body {
    margin: 0; height: 100%;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
  }
  body {
    background: linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 60%, var(--bg2) 100%) fixed;
    display: flex; align-items: center; justify-content: center;
  }
  .card { width: 100%; max-width: 420px; padding: 32px 24px; box-sizing: border-box; text-align: center; }

  /* ══ ロゴ(アイコン)サイズ調整はここ(.logo)を編集してください ══ */
  .logo {
    width: min(168px, 44vw);   /* ← 横幅の上限。数値を変えるとサイズが変わる */
    height: auto;
    margin: 0 auto 28px;
    display: block;
    border-radius: 12%;
    box-shadow: 0 10px 30px #0006;
  }

  .desc { font-size: 13px; color: var(--sub); line-height: 1.7; margin: 0 0 8px; }
  .btn-desc { font-size: 12px; color: var(--sub); opacity: 0.8; line-height: 1.6; margin: 8px 0 24px; }

  button {
    width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #ffffffaa;
    background: #ffffff1f; color: var(--ink); font-size: 15px; letter-spacing: 0.03em;
  }
  button:active { background: #ffffff44; }
  button:disabled { opacity: 0.4; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  #toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: var(--bg0); border: 1px solid var(--bg2); color: var(--ink);
    padding: 12px 20px; border-radius: 999px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  #page-2 { display: none; }
  #page-2 button + .btn-desc { margin-bottom: 24px; }
  #page-2 button:last-of-type { margin-top: 4px; }
</style>
</head>
<body>

<!-- ══ ページ1：初回の送信 ══ -->
<div class="card" id="page-1">
  <img src="Holo_findAR_icon.png" alt="Holo FindAR" class="logo">
  <p class="desc">現在地を取得し、ホログラムで方向を示す共有リンクを作成します。</p>
  <button id="share-initial">Share where you're</button>
  <p class="btn-desc">タップすると現在地を取得し、共有用リンクをコピーします。</p>
</div>

<!-- ══ ページ2：送信後の更新・再共有 ══ -->
<div class="card" id="page-2">
  <img src="Holo_findAR_icon.png" alt="Holo FindAR" class="logo">

  <button id="update-location">Update</button>
  <p class="btn-desc">現在地を再取得し、新しいリンクをコピーします。移動した場合はこちら。</p>

  <button id="share-again">Share where you're</button>
  <p class="btn-desc">直前に発行したリンクをもう一度コピーします。</p>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, addDoc, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { initializeAppCheck, ReCaptchaV3Provider }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js';

// FindARのindex.htmlと同じFirebaseプロジェクトの値
const firebaseConfig = {
  apiKey: "AIzaSyByb6EuWZ9Iy9QiR0Nw6IWRb8O_JQqpMSc",
  authDomain: "findar-ae099.firebaseapp.com",
  databaseURL: "https://findar-ae099-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "findar-ae099",
  storageBucket: "findar-ae099.firebasestorage.app",
  messagingSenderId: "1043165089164",
  appId: "1:1043165089164:web:0db15bfbef3d85d8df1aa9",
  measurementId: "G-J7H2LC9FFS"
};

// 受信側(矢印ホログラム)ページの公開URL。ファイル名を変えたらここも合わせる
const HOLO_URL = "https://shiguretei-amagasa.github.io/FindAR/holo-arrow.html";

const app = initializeApp(firebaseConfig);

// ── ローカル(Mac)でテストする時だけ、下の1行のコメントを外してください ──
// self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;

const appCheck = initializeAppCheck(app, {
  provider: new ReCaptchaV3Provider('6LeQYFItAAAAAGaVvZx_Txa8M26qytXHou4ZXmqk'),
  isTokenAutoRefreshEnabled: true
});

const db = getFirestore(app);

const page1 = document.getElementById('page-1');
const page2 = document.getElementById('page-2');
const shareInitialBtn = document.getElementById('share-initial');
const updateBtn = document.getElementById('update-location');
const shareAgainBtn = document.getElementById('share-again');
const toastEl = document.getElementById('toast');

let shareUrl = '';

function showToast(message) {
  toastEl.textContent = message;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2500);
}

function getCurrentPosition() {
  return new Promise((resolve, reject) => {
    if (!('geolocation' in navigator)) {
      reject(new Error('このブラウザは位置情報に対応していません'));
      return;
    }
    navigator.geolocation.getCurrentPosition(resolve, reject, {
      enableHighAccuracy: true,
      timeout: 15000
    });
  });
}

// 現在地取得 → Firestore書き込み(meetups: lat, lng, createdAt) → リンク生成 → クリップボードへコピー
async function captureAndShare(triggerButton) {
  triggerButton.disabled = true;
  try {
    const position = await getCurrentPosition();
    const lat = position.coords.latitude;
    const lng = position.coords.longitude;

    const docRef = await addDoc(collection(db, 'meetups'), {
      lat,
      lng,
      createdAt: serverTimestamp()
    });

    shareUrl = `${HOLO_URL}?id=${docRef.id}`;
    await navigator.clipboard.writeText(shareUrl);

    showToast('位置情報をコピーしました。');
  } catch (err) {
    console.error('[Holo FindAR] 送信エラー:', err);
    if (err.code === 1) {
      showToast('位置情報の利用が許可されていません');
    } else if (err.code === 2) {
      showToast('位置情報を取得できませんでした');
    } else if (err.code === 3) {
      showToast('位置情報の取得がタイムアウトしました');
    } else {
      showToast('送信に失敗しました。もう一度お試しください');
    }
  } finally {
    triggerButton.disabled = false;
  }
}

// ── ページ1：初回送信 ──
shareInitialBtn.addEventListener('click', async () => {
  await captureAndShare(shareInitialBtn);
  if (shareUrl) {
    page1.style.display = 'none';
    page2.style.display = 'block';
  }
});

// ── ページ2：Update(現在地を再取得して送り直す) ──
updateBtn.addEventListener('click', async () => {
  await captureAndShare(updateBtn);
});

// ── ページ2：Share where you're(直前のリンクを再コピーのみ) ──
shareAgainBtn.addEventListener('click', async () => {
  if (!shareUrl) return;
  try {
    await navigator.clipboard.writeText(shareUrl);
    showToast('位置情報をコピーしました。');
  } catch (err) {
    console.error('[Holo FindAR] コピー失敗:', err);
    showToast('コピーに失敗しました');
  }
});
</script>
</body>
</html>
